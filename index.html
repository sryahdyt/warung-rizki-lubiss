<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Warung Surya - Kasir V6.3</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Arial,sans-serif}
body{background:#f1f5f9;padding-bottom:30px}
header{background:#0f172a;color:#fff;padding:16px;text-align:center}
header h1{font-size:22px} header p{color:#94a3b8;font-size:12px}
.tabs{display:flex;gap:8px;padding:12px;max-width:700px;margin:auto}
.tab{flex:1;padding:12px;border:none;border-radius:12px;background:#fff;font-weight:800;cursor:pointer}
.tab.active{background:#0ea5e9;color:#fff}
.page{max-width:700px;margin:auto;padding:0 12px}
.cards{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-bottom:12px}
.card{background:#fff;padding:12px;border-radius:12px;text-align:center}
.card b{display:block}
input,select{width:100%;padding:12px;margin-bottom:8px;border-radius:10px;border:1px solid #ddd}
.btn{width:100%;padding:13px;border:none;border-radius:10px;font-weight:800;cursor:pointer;margin-bottom:8px}
.btn-blue{background:#0ea5e9;color:#fff}.btn-green{background:#16a34a;color:#fff}.btn-red{background:#ef4444;color:#fff}.btn-gray{background:#e2e8f0}
.item{background:#fff;padding:12px;border-radius:12px;margin-bottom:8px;display:flex;justify-content:space-between;align-items:center}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.p-item{background:#fff;padding:12px;border-radius:12px;cursor:pointer;text-align:center}
.p-item b{display:block;min-height:32px}
.struk{background:#fff;padding:14px;border-radius:12px;font-family:monospace;white-space:pre-wrap;margin-top:10px;border:1px dashed #999}
.hidden{display:none}
.cart{background:#fff;padding:14px;border-radius:14px;margin-top:12px}
@media print{ body *{visibility:hidden} #printArea, #printArea *{visibility:visible} #printArea{position:absolute;top:0;left:0;width:100%} }
</style>
</head>
<body>
<header><h1>🏪 Warung Surya</h1><p>V6.3.0 SIMPLE • Kasir + Stok + Hutang + Laporan</p></header>

<div class="tabs">
<button class="tab active" onclick="tab('kasir',this)">🛒 Kasir</button>
<button class="tab" onclick="tab('stok',this)">📦 Stok</button>
<button class="tab" onclick="tab('hutang',this)">📒 Hutang</button>
<button class="tab" onclick="tab('laporan',this)">📊 Laporan</button>
</div>

<!-- KASIR -->
<div id="page-kasir" class="page">
<div class="cards"><div class="card"><b id="omset">Rp 0</b><span>Omset Hari Ini</span></div><div class="card"><b id="trxCount">0</b><span>Transaksi</span></div><div class="card"><b id="hutangTop">Rp 0</b><span>Belum Dibayar</span></div></div>
<input placeholder="🔍 Cari barang..." oninput="cari=this.value;renderKasir()">
<div class="grid" id="grid"></div>
<div class="cart"><h3>🧾 Keranjang</h3><div id="cartList"></div><h3 id="total">Total: Rp 0</h3>
<select id="diskon" onchange="renderCart()"><option value="0">No Diskon</option><option value="5">Diskon 5%</option><option value="10">Diskon 10%</option></select>
<select id="metode"><option value="tunai">💵 Tunai</option><option value="hutang">📒 Hutang / Bon</option></select>
<input id="bayar" type="number" placeholder="Uang Pembeli">
<input id="namaHutang" placeholder="Nama yang ngutang (kalo hutang)">
<button class="btn btn-green" onclick="checkout()">✅ BAYAR</button>
<button class="btn btn-gray" onclick="cart={};renderCart()">🗑️ Kosongkan</button>
<div id="printArea"><div id="strukBox"></div></div>
<button class="btn btn-blue" onclick="window.print()">🖨️ PRINT STRUK</button>
</div>
</div>

<!-- STOK -->
<div id="page-stok" class="page hidden">
<div style="background:#fff;padding:14px;border-radius:14px;margin-bottom:10px">
<h3>➕ Tambah Barang</h3><br>
<input id="nama" placeholder="Nama Barang"><input id="harga" type="number" placeholder="Harga Jual"><input id="stok" type="number" placeholder="Stok">
<button class="btn btn-blue" onclick="tambah()">Simpan Barang</button>
</div><div id="listStok"></div>
</div>

<!-- HUTANG -->
<div id="page-hutang" class="page hidden"><div id="listHutang"></div></div>

<!-- LAPORAN -->
<div id="page-laporan" class="page hidden">
<div class="cards"><div class="card"><b id="omsetAll">Rp 0</b><span>Total Omset</span></div><div class="card"><b id="untungAll">Rp 0</b><span>Total Untung</span></div><div class="card"><b id="trxAll">0</b><span>Transaksi</span></div></div>
<div id="listTrx"></div>
</div>

<script>
let barang = JSON.parse(localStorage.getItem('surya_barang')||'[]');
let trx = JSON.parse(localStorage.getItem('surya_trx')||'[]');
let hutang = JSON.parse(localStorage.getItem('surya_hutang')||'[]');
let cart = {}; let cari = '';
if(barang.length==0){ barang=[{id:1,nama:'Indomie Goreng',harga:3500,stok:24},{id:2,nama:'Kopi Kapal Api',harga:2000,stok:20},{id:3,nama:'Aqua 600ml',harga:3500,stok:30},{id:4,nama:'Beras 5kg',harga:65000,stok:10}]; save(); }
function save(){ localStorage.setItem('surya_barang',JSON.stringify(barang)); localStorage.setItem('surya_trx',JSON.stringify(trx)); localStorage.setItem('surya_hutang',JSON.stringify(hutang)); }
function rp(n){ return 'Rp '+Number(n||0).toLocaleString('id-ID'); }
function tab(id,el){ document.querySelectorAll('.page').forEach(p=>p.classList.add('hidden')); document.getElementById('page-'+id).classList.remove('hidden'); document.querySelectorAll('.tab').forEach(t=>t.classList.remove('active')); el.classList.add('active'); renderAll(); }
function renderKasir(){ let list = barang.filter(b=>b.nama.toLowerCase().includes(cari.toLowerCase())); document.getElementById('grid').innerHTML = list.map(b=>`<div class="p-item" onclick="addCart(${b.id})"><div style="font-size:28px">📦</div><b>${b.nama}</b><div style="color:#0ea5e9;font-weight:800">${rp(b.harga)}</div><small>Stok: ${b.stok}</small></div>`).join('') || '<p style="text-align:center;padding:20px">Tidak ditemukan</p>'; renderCart(); }
function addCart(id){ let b=barang.find(x=>x.id==id); if(b.stok<=(cart[id]||0)){ alert('Stok habis!'); return; } cart[id]=(cart[id]||0)+1; renderCart(); }
function totalHitung(){ let sub=0; for(let id in cart){ let b=barang.find(x=>x.id==id); sub+=b.harga*cart[id]; } let d=+document.getElementById('diskon').value; return sub - sub*d/100; }
function renderCart(){ let html=''; for(let id in cart){ let b=barang.find(x=>x.id==id); html+=`<div style="display:flex;justify-content:space-between;padding:6px 0"><span>${b.nama} x ${cart[id]}</span><span>${rp(b.harga*cart[id])} <button onclick="cart[${id}]--;if(cart[${id}]<=0)delete cart[${id}];renderCart()">-</button> <button onclick="cart[${id}]++;renderCart()">+</button></span></div>`; } document.getElementById('cartList').innerHTML = html || 'Belum ada barang'; document.getElementById('total').innerText='Total: '+rp(totalHitung()); }
function checkout(){ let keys=Object.keys(cart); if(!keys.length){ alert('Keranjang kosong!'); return; } let total=totalHitung(); let metode=document.getElementById('metode').value; let items=keys.map(id=>{ let b=barang.find(x=>x.id==id); b.stok-=cart[id]; return {nama:b.nama,harga:b.harga,qty:cart[id],sub:b.harga*cart[id]}; }); let untung=items.reduce((a,i)=>a+(i.harga-0)*i.qty,0); // simple: untung = total, kalo mau modal tambahin nanti
if(metode=='tunai'){ let bayar=+document.getElementById('bayar').value||0; if(bayar<total){ alert('Uang kurang!'); return; } trx.unshift({id:Date.now(),tanggal:new Date().toLocaleString('id-ID'),items,total,tipe:'tunai'}); document.getElementById('strukBox').innerHTML=`<div class="struk">===== WARUNG SURYA =====\n${new Date().toLocaleString('id-ID')}\n${items.map(i=>i.nama+'\n'+i.qty+' x '+rp(i.harga)+' = '+rp(i.sub)).join('\n')}\n----------------\nTOTAL: ${rp(total)}\nBAYAR: ${rp(bayar)}\nKEMBALI: ${rp(bayar-total)}\n\nTerima kasih! 🙏</div>`; alert('Berhasil! Kembalian '+rp(bayar-total)); } else { let nama=document.getElementById('namaHutang').value.trim(); if(!nama){ alert('Isi nama yang ngutang!'); return; } hutang.unshift({id:Date.now(),nama,total,sisa:total,items,tanggal:new Date().toLocaleString('id-ID')}); trx.unshift({id:Date.now(),tanggal:new Date().toLocaleString('id-ID'),items,total,tipe:'hutang',nama}); document.getElementById('strukBox').innerHTML=`<div class="struk">BON HUTANG - WARUNG SURYA\nNama: ${nama}\n${items.map(i=>i.qty+'x '+i.nama+' = '+rp(i.sub)).join('\n')}\nTOTAL HUTANG: ${rp(total)}</div>`; alert('Hutang '+nama+' dicatat'); } cart={}; document.getElementById('bayar').value=''; document.getElementById('namaHutang').value=''; save(); renderAll(); }
function tambah(){ let nama=document.getElementById('nama').value.trim(); let harga=+document.getElementById('harga').value; let stok=+document.getElementById('stok').value; if(!nama||!harga){ alert('Isi nama & harga!'); return; } barang.unshift({id:Date.now(),nama,harga,stok}); save(); renderAll(); document.getElementById('nama').value=''; document.getElementById('harga').value=''; document.getElementById('stok').value=''; alert('Barang ditambah!'); }
function renderStok(){ document.getElementById('listStok').innerHTML = barang.map(b=>`<div class="item"><div><b>${b.nama}</b><br><small>${rp(b.harga)} • Stok: ${b.stok}</small></div><div><button onclick="barang.find(x=>x.id==${b.id}).stok++;save();renderAll()">+ Tambah</button> <button onclick="barang=barang.filter(x=>x.id!=${b.id});save();renderAll()">🗑️</button></div></div>`).join(''); }
function renderHutang(){ document.getElementById('listHutang').innerHTML = hutang.length ? hutang.map(h=>`<div class="item"><div><b>${h.nama}</b><br><small>${h.tanggal} • Sisa: ${rp(h.sisa)}</small></div><div><button onclick="bayarHutang(${h.id})">💵 Lunasin</button> <a href="https://wa.me/?text=${encodeURIComponent('Halo '+h.nama+', hutang lu di Warung Surya sisa '+rp(h.sisa))}" target="_blank"><button>📱 Tagih</button></a></div></div>`).join('') : '<p style="text-align:center;padding:20px">Tidak ada hutang 🎉</p>'; }
function bayarHutang(id){ let h=hutang.find(x=>x.id==id); h.sisa=0; hutang=hutang.filter(x=>x.id!=id); save(); renderAll(); alert(h.nama+' LUNAS!'); }
function renderLaporan(){ let today=new Date().toLocaleDateString('id-ID'); let hari=trx.filter(t=>new Date(t.id).toLocaleDateString('id-ID')==today); document.getElementById('omset').innerText=rp(hari.reduce((a,t)=>a+t.total,0)); document.getElementById('trxCount').innerText=hari.length; document.getElementById('hutangTop').innerText=rp(hutang.reduce((a,h)=>a+h.sisa,0)); document.getElementById('omsetAll').innerText=rp(trx.reduce((a,t)=>a+t.total,0)); document.getElementById('untungAll').innerText=rp(trx.reduce((a,t)=>a+t.total,0)); document.getElementById('trxAll').innerText=trx.length; document.getElementById('listTrx').innerHTML=trx.slice(0,20).map(t=>`<div class="item"><span>${t.tipe=='hutang'?'📒':'💵'} ${t.nama||''} - ${rp(t.total)}</span><small>${t.tanggal}</small></div>`).join(''); }
function renderAll(){ renderKasir(); renderStok(); renderHutang(); renderLaporan(); }
renderAll();
</script>
</body>
</html>
